# Netlify hosts the client only.
#
# Scrawl is a real-time game: the server holds a WebSocket open to every
# player for the length of a round. Netlify serves static files and
# short-lived functions, so it cannot host that half. Point VITE_SERVER_URL at
# a host that can — Render, Fly.io and Railway all have a free tier — or skip
# Netlify entirely and run `npm start`, which serves both from one process.

[build]
  command = "npm run build:client"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"
  # Set this in the Netlify UI, not here, so the repo carries no deploy URL:
  #   VITE_SERVER_URL = "https://your-server.onrender.com"

# A single-page app: every path has to fall through to the shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
