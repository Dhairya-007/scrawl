name: Test and build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Smoke test a real game over sockets
        run: |
          PORT=3199 node server/dist/index.js &
          SCRAWL_URL=http://localhost:3199 node scripts/smoke.mjs
